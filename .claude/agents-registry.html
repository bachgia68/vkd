<title>TA Agents Registry</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #ffffff;
  --text: #1a1a1a;
  --border: #e0e0e0;
  --hover: #f5f5f5;
  --accent: #0066cc;
  --badge-bg: #f0f0f0;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --text: #ffffff;
    --border: #333333;
    --hover: #2a2a2a;
    --accent: #4fa3ff;
    --badge-bg: #2a2a2a;
  }
}

* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  line-height: 1.6;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

h1 { margin: 0 0 10px 0; font-size: 28px; }
.subtitle { color: #666; margin-bottom: 20px; font-size: 14px; }

.controls {
  display: flex;
  gap: 15px;
  margin-bottom: 30px;
  flex-wrap: wrap;
}

input, select {
  padding: 10px 15px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(0,102,204,0.1);
}

.agents-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 15px;
}

.agent-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  background: var(--bg);
  cursor: pointer;
  transition: all 0.2s;
  border-left: 4px solid transparent;
}

.agent-card:hover {
  background: var(--hover);
  border-color: var(--accent);
  border-left-color: var(--accent);
  transform: translateY(-2px);
}

.agent-header {
  display: flex;
  align-items: start;
  gap: 10px;
  margin-bottom: 10px;
}

.agent-emoji { font-size: 24px; line-height: 1; }
.agent-name { font-weight: 600; font-size: 15px; margin: 0; }
.agent-division { font-size: 12px; color: #666; margin: 4px 0 0 0; }
.agent-description {
  font-size: 13px;
  color: #888;
  line-height: 1.5;
  margin: 10px 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.agent-vibe { font-size: 12px; font-style: italic; color: #999; margin: 8px 0 0 0; }
.agent-copy { margin-top: 12px; }

button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  transition: opacity 0.2s;
}

button:hover { opacity: 0.9; }

.stats {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
  font-size: 14px;
}

.stat { color: #666; }
.empty { text-align: center; padding: 40px 20px; color: #999; }
.badge {
  display: inline-block;
  background: var(--badge-bg);
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  margin-top: 8px;
}

@media (max-width: 768px) {
  .agents-grid { grid-template-columns: 1fr; }
  .controls { flex-direction: column; }
  input, select { width: 100%; }
}
</style>

<div class="container">
  <h1>🤖 TA Agents Registry</h1>
  <p class="subtitle">254 AI agents across 17 divisions • <a href="https://github.com/msitarzewski/agency-agents" target="_blank">Agency Agents</a></p>

  <div class="controls">
    <input type="text" id="search" placeholder="Search agents...">
    <select id="division">
      <option value="">All Divisions (17)</option>
      <option value="engineering">Engineering (58)</option>
      <option value="specialized">Specialized (57)</option>
      <option value="marketing">Marketing (36)</option>
      <option value="security">Security (12)</option>
      <option value="gis">GIS (13)</option>
      <option value="sales">Sales (9)</option>
      <option value="testing">Testing (9)</option>
      <option value="project-management">Project Management (7)</option>
      <option value="paid-media">Paid Media (7)</option>
      <option value="design">Design (10)</option>
      <option value="game-development">Game Development (6)</option>
      <option value="academic">Academic (6)</option>
      <option value="support">Support (6)</option>
      <option value="product">Product (5)</option>
      <option value="finance">Finance (5)</option>
      <option value="healthcare">Healthcare (3)</option>
      <option value="spatial-computing">Spatial Computing (6)</option>
    </select>
  </div>

  <div class="stats">
    <div class="stat"><strong>254</strong> Total Agents</div>
    <div class="stat"><strong id="count">254</strong> Shown</div>
  </div>

  <div id="agents" class="agents-grid"></div>
</div>

<script>
// Agent data loaded from catalog
const catalogUrl = './.claude/agents-catalog.json';

async function loadAndRender() {
  try {
    const response = await fetch(catalogUrl);
    const data = await response.json();
    const agents = data.agents;

    function render(filtered) {
      const container = document.getElementById('agents');
      const count = document.getElementById('count');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty" style="grid-column: 1/-1;">No agents found</div>';
        count.textContent = '0';
        return;
      }

      container.innerHTML = filtered.map(agent => `
        <div class="agent-card">
          <div class="agent-header">
            <div class="agent-emoji">${agent.emoji}</div>
            <div>
              <h3 class="agent-name">${agent.name}</h3>
              <p class="agent-division">📁 ${agent.division.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</p>
            </div>
          </div>
          <p class="agent-description">${agent.description || 'No description'}</p>
          ${agent.vibe ? `<p class="agent-vibe">"${agent.vibe}"</p>` : ''}
          <div class="agent-copy">
            <button onclick="copyId('${agent.id}', '${agent.name}')">Copy Agent ID</button>
          </div>
          <div class="badge">${agent.id}</div>
        </div>
      `).join('');

      count.textContent = filtered.length;
    }

    function filter() {
      const search = document.getElementById('search').value.toLowerCase();
      const division = document.getElementById('division').value;

      let filtered = agents.filter(agent => {
        const matchSearch = !search ||
          agent.name.toLowerCase().includes(search) ||
          (agent.description && agent.description.toLowerCase().includes(search));
        const matchDiv = !division || agent.division === division;
        return matchSearch && matchDiv;
      });

      render(filtered.sort((a, b) => a.name.localeCompare(b.name)));
    }

    function copyId(id, name) {
      navigator.clipboard.writeText(id).then(() => {
        alert(`Copied: ${name}\nAgent ID: ${id}`);
      });
    }

    window.copyId = copyId;
    document.getElementById('search').addEventListener('input', filter);
    document.getElementById('division').addEventListener('change', filter);

    render(agents.sort((a, b) => a.name.localeCompare(b.name)));
  } catch (e) {
    document.getElementById('agents').innerHTML = `<div class="empty" style="grid-column: 1/-1;">Error loading agents: ${e.message}</div>`;
  }
}

loadAndRender();
</script>
